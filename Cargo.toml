[workspace]
resolver = "2"
members = ["crates/proto", "crates/aniway", "crates/aniwayd", "crates/aniway-editor"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[profile.release]
lto = "thin"
